<!DOCTYPE html>
<html lang="it">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        @import url("https://fonts.googleapis.com/css2?family=Roboto:wght@400;500&display=swap");

        :root {
            --first-color: #1A73E8;
            --second-color: #34A853;
            --input-color: #80868B;
            --border-color: #DADCE0;
            --body-font: "Roboto", sans-serif;
            --normal-font-size: 1rem;
            --small-font-size: .75rem;
        }

        *,
        ::before,
        ::after {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: var(--body-font);
            font-size: var(--normal-font-size);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background: linear-gradient(135deg, var(--first-color), var(--second-color));
            background-attachment: fixed;
        }

        .form-container {
            width: 360px;
            padding: 3rem 2rem;
            border-radius: 1rem;
            box-shadow: 0 10px 25px rgba(92, 99, 105, 0.2);
            background: white;
            text-align: center;
            position: relative;
        }

        .form__title {
            font-weight: 500;
            margin-bottom: 2rem;
            color: var(--first-color);
        }

        .form__div {
            position: relative;
            height: 52px;
            margin-bottom: 1.5rem;
        }

        .form__input {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            font-size: var(--normal-font-size);
            border: 2px solid var(--border-color);
            border-radius: 0.5rem;
            outline: none;
            padding: 1rem;
            background: none;
            z-index: 1;
            transition: 0.3s;
        }

        .form__input:focus {
            border-color: var(--first-color);
            box-shadow: 0 0 10px rgba(26, 115, 232, 0.5);
        }

        .form__label {
            position: absolute;
            left: 1rem;
            top: 1rem;
            padding: 0 0.25rem;
            background-color: #fff;
            color: var(--input-color);
            font-size: var(--normal-font-size);
            transition: 0.3s;
        }

        .form__input:focus+.form__label,
        .form__input:not(:placeholder-shown).form__input:not(:focus)+.form__label {
            top: -0.5rem;
            left: 0.8rem;
            color: var(--first-color);
            font-size: var(--small-font-size);
            font-weight: 500;
            z-index: 10;
        }

        .form__button {
            text-decoration: none;
            color: white;
            display: block;
            text-align: center;
            padding: 0.75rem;
            background: linear-gradient(135deg, var(--first-color), var(--second-color));
            font-size: var(--normal-font-size);
            border-radius: 0.5rem;
            cursor: pointer;
            transition: 0.3s;
            margin-bottom: 1rem;
        }

        .form__button:hover {
            box-shadow: 0 10px 36px rgba(0, 0, 0, 0.15);
        }

        .hidden {
            display: none;
        }
    </style>
    <title>Login</title>
</head>

<body>
    <div class="form-container" id="login-form">
        <h1 class="form__title">Log In</h1>
        <form action="process.php" method="post">
            <div class="form__div">
                <input type="email" name="email" class="form__input" placeholder=" " required>
                <label class="form__label">Email</label>
            </div>
            <div class="form__div">
                <input type="password" name="password" class="form__input" placeholder=" " required>
                <label class="form__label">Password</label>
            </div>
            <button type="submit" name="login" class="form__button">Log In</button>
        </form>
        <button class="form__toggle" onclick="toggleForms()">Don't have an account? Register</button>
    </div>

    <div class="form-container hidden" id="signup-form">
        <h1 class="form__title">Sign Up</h1>
        <form action="process.php" method="post">
            <div class="form__div">
                <input type="text" name="name" class="form__input" placeholder=" " required>
                <label class="form__label">Nome</label>
            </div>
            <div class="form__div">
                <input type="email" name="email" class="form__input" placeholder=" " required>
                <label class="form__label">Email</label>
            </div>
            <div class="form__div">
                <input type="password" name="password" class="form__input" placeholder=" " required>
                <label class="form__label">Password</label>
            </div>
            <button type="submit" name="signup" class="form__button">Sign Up</button>
        </form>
        <button class="form__toggle" onclick="toggleForms()">Already have an account? Log in</button>
    </div>

    <script>
        function toggleForms() {
            document.getElementById('login-form').classList.toggle('hidden');
            document.getElementById('signup-form').classList.toggle('hidden');
        }
    </script>
</body>

</html>
